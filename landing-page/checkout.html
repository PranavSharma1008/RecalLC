<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecallLC Checkout — Razorpay</title>
    <style>
      :root {
        --bg: #0b0e14;
        --surface: #141721;
        --surface-hover: #1c202e;
        --border: rgba(255, 255, 255, 0.08);
        --text: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #7c5cff;
        --accent-hover: #6a48f5;
        --success: #10b981;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 16px;
        overflow: hidden;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        max-width: 440px;
        width: 100%;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        animation: fadeIn 0.25s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .spinner {
        display: inline-block;
        width: 38px;
        height: 38px;
        border: 3px solid rgba(124, 92, 255, 0.2);
        border-radius: 50%;
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      .mini-spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(16, 185, 129, 0.25);
        border-radius: 50%;
        border-top-color: var(--success);
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 12px 20px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 14px;
      }
      .btn:hover {
        background: var(--accent-hover);
      }
      .btn-outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .btn-outline:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        background: rgba(124, 92, 255, 0.12);
        color: #c4b5fd;
        border: 1px solid rgba(124, 92, 255, 0.25);
        margin-bottom: 14px;
      }
      .status-text {
        font-size: 13px;
        color: var(--muted);
        margin-top: 8px;
        line-height: 1.5;
      }
      .success-box {
        animation: fadeIn 0.3s ease-out;
      }
      .success-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(16, 185, 129, 0.15);
        color: var(--success);
        font-size: 28px;
        border: 1px solid rgba(16, 185, 129, 0.3);
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card" id="main-card">
      <div class="spinner" id="loading-spinner"></div>
      <div>
        <span class="badge">🔒 Razorpay Live Gateway</span>
      </div>
      <h2 id="title" style="font-size: 1.25rem; font-weight: 700; margin-bottom: 6px">Preparing Checkout...</h2>
      <p id="description" class="status-text">Connecting securely to payment gateway...</p>

      <button id="pay-btn" class="btn" style="display: none">⚡ Open Razorpay Payment Modal</button>
      <button id="cancel-btn" class="btn btn-outline" style="display: none; margin-top: 8px">✕ Cancel</button>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      (async function () {
        const titleEl = document.getElementById('title');
        const descEl = document.getElementById('description');
        const spinnerEl = document.getElementById('loading-spinner');
        const payBtn = document.getElementById('pay-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const mainCard = document.getElementById('main-card');

        // Parse query params
        const urlParams = new URLSearchParams(window.location.search);
        const amountNum = parseFloat(urlParams.get('amount')) || 89;
        const amountPaise = Math.max(100, Math.round(amountNum * 100));
        const emailParam = (urlParams.get('email') || '').trim();
        const contactParam = (urlParams.get('contact') || '').trim();
        const nameParam = (urlParams.get('name') || '').trim();

        // Clear local storage on this checkout origin to ensure no stale default contacts persist
        try {
          localStorage.clear();
          sessionStorage.clear();
        } catch (e) {}

        let currentOrderId = null;
        let rzpInstance = null;

        function returnToPreviousPage() {
          window.parent.postMessage({ type: 'PAYMENT_CANCELLED' }, '*');
          if (window.opener) {
            window.close();
          } else if (window.history.length > 1) {
            window.history.back();
          }
        }

        cancelBtn.addEventListener('click', returnToPreviousPage);

        payBtn.addEventListener('click', () => {
          if (rzpInstance) {
            rzpInstance.open();
          } else {
            initCheckout();
          }
        });

        async function initCheckout() {
          try {
            spinnerEl.style.display = 'inline-block';
            payBtn.style.display = 'none';
            cancelBtn.style.display = 'none';
            titleEl.textContent = 'Creating Order...';
            descEl.textContent = `Preparing payment of ₹${amountNum.toFixed(2)}`;

            // 1. Get Key ID from backend
            let keyId = '';
            try {
              const cfgRes = await fetch('/api/config');
              if (cfgRes.ok) {
                const cfg = await cfgRes.json();
                if (cfg.razorpay_key_id) keyId = cfg.razorpay_key_id;
              }
            } catch (e) {}

            // 2. Create Order
            const orderRes = await fetch('/api/create-order', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                amount: amountPaise,
                currency: 'INR',
                receipt: 'rcpt_' + Date.now(),
                notes: { product: 'RecallLC Pro / Support' },
              }),
            });

            if (!orderRes.ok) {
              const err = await orderRes.json().catch(() => ({}));
              throw new Error(err.error || 'Could not create order on server');
            }

            const order = await orderRes.json();
            currentOrderId = order.order_id;

            titleEl.textContent = `Order Ready: ₹${amountNum.toFixed(2)}`;
            descEl.textContent = 'Opening Razorpay checkout...';
            spinnerEl.style.display = 'none';

            // Ensure prefill has empty strings by default so Razorpay never autofills stale emails or numbers
            const prefill = {
              name: nameParam || '',
              email: emailParam || '',
              contact: contactParam || '',
            };

            // 3. Launch Checkout in full mode
            const options = {
              key: keyId,
              amount: order.amount,
              currency: order.currency,
              name: 'RecallLC',
              description: `Contribution (₹${amountNum.toFixed(2)})`,
              order_id: order.order_id,
              handler: async function (response) {
                await verifyPayment(response);
              },
              modal: {
                ondismiss: function () {
                  // User dismissed or clicked close: return immediately to previous page
                  window.parent.postMessage({ type: 'PAYMENT_CANCELLED' }, '*');
                  titleEl.textContent = 'Payment Cancelled';
                  descEl.textContent = 'Returning to previous page...';
                  setTimeout(() => {
                    if (window.opener) {
                      window.close();
                    } else if (window.history.length > 1) {
                      window.history.back();
                    }
                  }, 400);
                },
                backdropclose: true,
                escape: true,
              },
              theme: {
                color: '#7c5cff',
                backdrop_color: 'rgba(11, 14, 20, 0.9)',
              },
              prefill: prefill,
            };

            rzpInstance = new window.Razorpay(options);

            rzpInstance.on('payment.failed', function (res) {
              titleEl.textContent = 'Payment Failed';
              descEl.textContent = res.error.description || 'Transaction declined.';
              payBtn.textContent = 'Try Again';
              payBtn.style.display = 'block';
              cancelBtn.style.display = 'block';
              window.parent.postMessage({ type: 'PAYMENT_FAILED', error: res.error }, '*');
            });

            rzpInstance.open();
          } catch (err) {
            spinnerEl.style.display = 'none';
            titleEl.textContent = 'Connection Error';
            descEl.textContent = err.message || 'Make sure the backend server is running.';
            payBtn.textContent = 'Retry';
            payBtn.style.display = 'block';
            cancelBtn.style.display = 'block';
          }
        }

        async function verifyPayment(paymentResponse) {
          titleEl.textContent = 'Verifying Payment...';
          descEl.textContent = 'Confirming signature with backend...';
          spinnerEl.style.display = 'inline-block';

          try {
            const verifyRes = await fetch('/api/verify-payment', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                razorpay_order_id: paymentResponse.razorpay_order_id,
                razorpay_payment_id: paymentResponse.razorpay_payment_id,
                razorpay_signature: paymentResponse.razorpay_signature,
              }),
            });

            const verifyData = await verifyRes.json();
            spinnerEl.style.display = 'none';

            if (verifyRes.ok && verifyData.success) {
              const safePaymentId = String(paymentResponse.razorpay_payment_id || '').replace(/[^a-zA-Z0-9_-]/g, '');
              mainCard.innerHTML = `
                <div class="success-box">
                  <div class="success-icon">✓</div>
                  <h2 style="font-size: 1.35rem; font-weight: 700; color: #10b981; margin-bottom: 8px;">Payment Successful!</h2>
                  <p class="status-text" style="margin-bottom: 16px;">
                    Payment ID: <code style="color: #fff; background: rgba(255,255,255,0.08); padding: 3px 7px; border-radius: 4px; font-family: monospace; font-size: 12px;">${safePaymentId}</code><br/>
                    Thank you for supporting RecallLC!
                  </p>
                  <div style="display: flex; align-items: center; justify-content: center; font-size: 12px; color: #34d399; font-weight: 500;">
                    <span class="mini-spinner"></span>
                    <span>Returning to extension in 5 seconds...</span>
                  </div>
                </div>
              `;

              // Show Razorpay success confirmation message for 5 seconds as requested, then notify extension
              setTimeout(() => {
                window.parent.postMessage(
                  {
                    type: 'PAYMENT_SUCCESS',
                    payment_id: paymentResponse.razorpay_payment_id,
                    order_id: paymentResponse.razorpay_order_id,
                    amount: amountNum,
                  },
                  '*',
                );

                window.parent.postMessage({ type: 'PAYMENT_REDIRECT' }, '*');
                if (window.opener) {
                  window.close();
                } else if (window.history.length > 1) {
                  window.history.back();
                } else {
                  window.location.href = '/';
                }
              }, 5000);
            } else {
              titleEl.textContent = '⚠️ Verification Failed';
              descEl.textContent = verifyData.message || 'Signature mismatch';
              payBtn.textContent = 'Retry Payment';
              payBtn.style.display = 'block';
            }
          } catch (err) {
            spinnerEl.style.display = 'none';
            titleEl.textContent = 'Verification Network Error';
            descEl.textContent = err.message;
          }
        }

        // Auto-run on load
        initCheckout();
      })();
    </script>
  </body>
</html>
